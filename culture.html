<button class="back-button" id="back-button" data-translate="back_button">BACK</button>

<script>
function initCulturePage() {
  if (window.translationManager?.isLoaded) {
    window.languageSelector?.createSelector?.();
    window.languageSelector?.updateSelectorValue?.();
  } else {
    setTimeout(initCulturePage, 100);
  }
}
function goToCulturePage(target, requiresFull) {
  if (requiresFull && window.checkPageAccess && !window.checkPageAccess(target)) return;
  window.location.href = target;
}
document.addEventListener('DOMContentLoaded', () => {
  initCulturePage();
  document.querySelectorAll('[data-culture-target]').forEach((btn) => {
    btn.addEventListener('click', () => goToCulturePage(btn.dataset.cultureTarget, btn.dataset.requiresFull === '1'));
  });
  const backButton = document.getElementById('back-button');
  if (backButton) backButton.addEventListener('click', () => { window.location.href = 'main.html'; });
});
</script>
<script>
(function () {
  var LANG_ALIASES = { ja: ["ja", "jp"], jp: ["jp", "ja"], cn: ["cn", "zh"], zh: ["zh", "cn"] };
  function normalizeLang(lang) {
    lang = String(lang || localStorage.getItem("selectedLanguage") || "fr").toLowerCase();
    if (lang === "jp") return "ja";
    if (lang === "zh" || lang === "zh-cn") return "cn";
    return lang;
  }
  var CLQ_BACK_BUTTON_LABELS = { fr: "RETOUR", en: "BACK", nl: "TERUG", de: "ZURÜCK", it: "INDIETRO", es: "VOLVER", pl: "POWRÓT", ar: "رجوع", cn: "返回", ja: "戻る", jp: "戻る", zh: "返回" };
  function applyCultureBackButton(lang) {
    var code = normalizeLang(lang);
    var label = CLQ_BACK_BUTTON_LABELS[code] || CLQ_BACK_BUTTON_LABELS.fr;
    document.querySelectorAll('[data-translate="back_button"]').forEach(function (el) {
      el.textContent = label;
    });
  }
  function pickStrict(map, lang) {
    if (!map) return "";
    var codes = LANG_ALIASES[lang] || [lang];
    for (var i = 0; i < codes.length; i++) {
      var exact = map[codes[i]];
      if (exact != null && String(exact).trim() !== "") return exact;
    }
    return "";
  }
  function applyCultureHubLabels() {
    var lang = normalizeLang(localStorage.getItem("selectedLanguage") || "");
    document.querySelectorAll("[data-title-i18n]").forEach(function (el) {
      try {
        var map = JSON.parse(el.getAttribute("data-title-i18n") || "{}");
        var label = pickStrict(map, lang);
        if (label) el.textContent = (el.getAttribute("data-title-prefix") || "") + label;
      } catch (_) {}
    });
    applyCultureBackButton(lang);
  }
  document.addEventListener("languageChanged", function () {
    applyCultureHubLabels();
  });
  function boot() { applyCultureHubLabels(); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
